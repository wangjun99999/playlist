name: 更新青岛联通组播源

on:
  schedule:
    # 源仓库大约北京时间 07:00 / 14:00 更新，我们晚 40 分钟跑
    - cron: '40 7,14 * * *'   # → 北京时间 15:40 和 22:40
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载最新组播源
        run: |
          curl -sL "https://raw.githubusercontent.com/q1017673817/iptvz/main/%E7%BB%84%E6%92%AD_%E5%B1%B1%E4%B8%9C%E8%81%94%E9%80%9A.txt" \
            -o shandong_lt.txt

      - name: 只替换「青岛联通」分组的地址
        run: |
          python3 << 'EOF'
          from collections import defaultdict
          import re

          # 1. 构建 rtp路径 → 完整URL列表 的映射
          rtp_map = defaultdict(list)
          with open("shandong_lt.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or ",#genre#" in line:
                      continue
                  if "," in line and "/rtp/" in line:
                      _, url = line.split(",", 1)
                      url = url.strip()
                      if "/rtp/" in url:
                          rtp = url.split("/rtp/")[1]          # 239.253.254.xx:8000
                          if url not in rtp_map[rtp]:
                              rtp_map[rtp].append(url)

          print(f"组播源共解析到 {len(rtp_map)} 个不同的 rtp 路径")

          # 2. 读取 wj.m3u
          with open("wj.m3u", encoding="utf-8") as f:
              lines = f.readlines()

          new_lines = []
          i = 0
          updated = 0
          in_qingdao = False

          while i < len(lines):
              line = lines[i]

              # 检测是否进入「青岛联通」分组
              if 'group-title="青岛联通"' in line:
                  in_qingdao = True
              elif 'group-title="' in line and 'group-title="青岛联通"' not in line:
                  in_qingdao = False

              # 如果是青岛联通分组里的 http://192.168.2.98:5140/ 地址
              if in_qingdao and line.strip().startswith("http://192.168.2.98:5140/rtp/"):
                  old_url = line.strip()
                  rtp = old_url.split("/rtp/")[1]
                  if rtp in rtp_map:
                      # 用找到的多条地址替换原来的单条
                      for new_url in rtp_map[rtp]:
                          new_lines.append(new_url + "\n")
                      updated += 1
                      # print(f"替换: {rtp} → {len(rtp_map[rtp])} 个源")
                  else:
                      # 没找到对应源，保留原地址
                      new_lines.append(line)
              else:
                  new_lines.append(line)

              i += 1

          with open("wj.m3u", "w", encoding="utf-8") as f:
              f.writelines(new_lines)

          print(f"成功替换了 {updated} 个频道的地址")
          EOF

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wj.m3u
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "自动更新青岛联通组播源 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
