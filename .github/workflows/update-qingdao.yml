name: 更新青岛联通组播源

on:
  schedule:
    - cron: '40 7,14 * * *'   # 北京时间 15:40 和 22:40
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载最新组播源
        run: |
          curl -sL "https://raw.githubusercontent.com/q1017673817/iptvz/main/%E7%BB%84%E6%92%AD_%E5%B1%B1%E4%B8%9C%E8%81%94%E9%80%9A.txt" \
            -o shandong_lt.txt

      - name: 替换所有 192.168.2.98:5140 地址
        run: |
          python3 << 'EOF'
          from collections import defaultdict

          # 1. 解析 TXT，构建 rtp → 完整URL列表
          rtp_map = defaultdict(list)
          proxy_bases = set()

          with open("shandong_lt.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or ",#genre#" in line:
                      continue
                  if "," in line and "/rtp/" in line:
                      _, url = line.split(",", 1)
                      url = url.strip()
                      if "/rtp/" in url:
                          rtp = url.split("/rtp/")[1]
                          base = url.split("/rtp/")[0] + "/"
                          proxy_bases.add(base)
                          if url not in rtp_map[rtp]:
                              rtp_map[rtp].append(url)

          proxy_bases = sorted(proxy_bases)
          print(f"可用代理前缀: {proxy_bases}")
          print(f"有真实源的 rtp 数量: {len(rtp_map)}")

          # 2. 处理 wj.m3u
          with open("wj.m3u", encoding="utf-8") as f:
              lines = f.readlines()

          new_lines = []
          matched = 0
          forced = 0

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("http://192.168.2.98:5140/rtp/"):
                  rtp = stripped.split("/rtp/")[1]

                  if rtp in rtp_map:
                      # 有真实源 → 用 TXT 里的地址
                      for new_url in rtp_map[rtp]:
                          new_lines.append(new_url + "\n")
                      matched += 1
                  else:
                      # 没有真实源 → 强制用所有代理前缀 + 原 rtp
                      for base in proxy_bases:
                          new_lines.append(f"{base}rtp/{rtp}\n")
                      forced += 1
              else:
                  new_lines.append(line)

          with open("wj.m3u", "w", encoding="utf-8") as f:
              f.writelines(new_lines)

          print(f"成功匹配替换: {matched} 个频道")
          print(f"强制前缀替换: {forced} 个频道")
          print("全部 192.168.2.98:5140 地址已处理完毕")
          EOF

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wj.m3u
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "强制替换所有青岛联通组播源 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
